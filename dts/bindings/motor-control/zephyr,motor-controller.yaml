description: |
  Motor controller: composes one sensor, one actuator, and an ordered algorithm
  pipeline (phandles). The user wires concrete devices and algorithm nodes in
  Devicetree; the subsystem exposes a @c motor_t handle to the application API.

  @c algorithm is an ordered list outer → inner. A single phandle remains valid
  (current-only). Example cascade::

    algorithm = <&vel_pi &adrc>;

compatible: "zephyr,motor-controller"

include: base.yaml

properties:
  sensor:
    type: phandle
    required: true
    description: |
      Sensor backend (e.g. zephyr,motor-sensor-stm32). See
      per-sensor bindings (e.g. pole-pairs on position sensors).

  actuator:
    type: phandle
    required: true
    description: |
      Power stage (e.g. zephyr,motor-stage-hbridge-stm32): N half-bridges, see
      zephyr,motor-stage-hbridge-common.yaml.

  algorithm:
    type: phandles
    required: true
    description: |
      Ordered algorithm pipeline (outer → inner). Each phandle references a
      node such as zephyr,motor-algorithm-velocity-pi,
      zephyr,motor-algorithm-dc-current, or zephyr,motor-algorithm-adrc-current.
