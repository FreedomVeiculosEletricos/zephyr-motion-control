description: |
  STM32 motor power stage using ST LL timer APIs directly (no Zephyr PWM on the
  hot path). Each entry in pwm-channels selects one timer channel (1..4) that
  drives one half-bridge leg as a complementary HS/LS pair (CHx + CHxN) with
  hardware dead-time. The referenced timer MUST be an advanced timer with the
  "brk" interrupt (TIM1 / TIM8 on STM32G4 etc.); non-advanced timers are
  rejected at build time.

  By default, pinctrl state "complementary" is applied with 2 * len(pwm-channels)
  pin entries (HS + LS per leg). When the optional "single-ended" flag is set,
  state "single-ended" is applied instead with len(pwm-channels) pin entries
  (HS only); the LS pin stays at its hardware reset state. The timer still
  generates the complementary signal internally — it just is not routed to a
  pin in that mode.

  Use one timer instance for all legs so ADC TRGO and switching stay
  synchronized. Disable the Zephyr pwm child node for the same timer
  (status = "disabled") so the peripheral is not claimed twice.

compatible: "zephyr,motor-stage-hbridge-stm32"

include: ["zephyr,motor-stage-hbridge-common.yaml", pinctrl-device.yaml]

properties:
  st,pwm-timer:
    type: phandle
    required: true
    description: |
      Advanced timer instance with complementary outputs and "brk" interrupt
      (e.g. &timers1, &timers8). Must match adc-trigger-timer on the
      motor-sensor-stm32 node (software-triggered ADC) paired with this stage.

  pwm-channels:
    type: array
    required: true
    description: |
      Timer channel index per half-bridge leg (1..4), one cell per leg, e.g.
      pwm-channels = <1 2>; Length 1 = single half-bridge; length 2 =
      full-bridge DC (bidirectional); length 3 = reserved for future
      multi-leg topologies. Each channel always drives a complementary
      CHx/CHxN pair in the timer (single-ended only affects pinmux routing).

  trgo-source:
    type: string
    required: true
    enum:
      - update
      - reset
      - enable
      - compare_pulse
    description: |
      TIM TRGO output selection (maps to STM32 LL_TIM_TRGO_*). Use update for
      edge-aligned PWM so each period triggers one ADC sequence.
