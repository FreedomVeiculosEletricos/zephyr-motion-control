name: "Continuous Integration"

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - 'releases/**'

jobs:
  nix-check:
    runs-on: self-hosted
    steps:
      - uses: ossystems/nix-actions@v1
        with:
          build-hosts: false
          build-devshells: false

  build:
    runs-on: self-hosted
    steps:
      - uses: ossystems/nix-actions@v1
        with:
          devshell: .#default
          export-devshell: true
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Prepare Zephyr Project workspace
        run: |
          west config --global update.narrow true
          west update

      - name: Twister Tests
        id: twister-tests
        env:
          # native_sim's host runner defaults to -O0, which makes glibc reject
          # _FORTIFY_SOURCE and fails the build under -Werror.
          NSI_OPT: -O2
        run: west twister -G --testsuite-root tests -p native_sim/native/64 --tag motor --clobber-output --inline-logs -v -N -M

      - name: Merge Test Results
        if: steps.twister-tests.conclusion == 'failure'
        run: |
          junitparser merge **/twister.xml junit.xml
          junit2html junit.xml junit.html

      - name: Upload Unit Test Results in HTML
        if: steps.twister-tests.conclusion == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: HTML Unit Test Results
          if-no-files-found: ignore
          path: |
            junit.html

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action/linux@v2
        if: steps.twister-tests.conclusion == 'failure'
        with:
          check_name: Unit Test Results
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: "**/twister.xml"
